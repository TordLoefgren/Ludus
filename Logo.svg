<svg viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="LVDVS with specified easing curve and shorter handles">
  <!-- Wordmark -->
  <text x="600" y="140" text-anchor="middle" dominant-baseline="middle"
        font-family="Cinzel, 'Trajan Pro', 'Times New Roman', serif" font-weight="700" font-size="156" letter-spacing="12" fill="currentColor">
    LVDVS
  </text>

  <!-- Bezier Curve -->
  <path d="M160 280 C 380 180, 820 280, 1040 200"
        fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round"/>

  <!-- Visual handles -->
  <g stroke="currentColor" stroke-width="6" opacity="0.35" fill="none">
    <line x1="160" y1="280" x2="336.0" y2="200.0"/>
    <line x1="1040" y1="200" x2="864.0" y2="264.0"/>
  </g>
  <g fill="currentColor" opacity="0.8">
    <circle cx="336.0" cy="200.0" r="8"/>
    <circle cx="864.0" cy="264.0" r="8"/>
  </g>
</svg>
