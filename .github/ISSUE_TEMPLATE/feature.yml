---
name: Feature
description: Add or improve functionality.
title: "[Feature]: "
labels:
  - "Type: Feature"
  - "Status: Planned"
assignees:
  - TordLoefgren

body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What should this feature do and why is it valuable?
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: Tasks
      description: Break the work into small, verifiable steps.
      value: |
        - [ ] Implementation
        - [ ] Tests
        - [ ] Docs / README snippet
