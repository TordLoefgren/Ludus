name: "Story"
description: "Broad goal made up of multiple features or fixes."
labels: ["Type: Story", "Status: Planned"]
body:
  - type: input
    id: summary
    attributes:
      label: Summary
      description: One-sentence goal.
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why this story matters.

  - type: textarea
    id: child_issues
    attributes:
      label: Linked Issues
      description: Related features or fixes.
      value: |
        - [ ] #<issue_number>

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: When is this Story complete?
      value: |
        - [ ] All child issues closed
        - [ ] Code compiles and runs
