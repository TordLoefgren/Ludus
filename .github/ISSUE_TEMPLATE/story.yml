---
name: Story
description: Broad goal made up of multiple issues.
title: "[Story]: "
labels:
  - "Type: Story"
assignees:
  - TordLoefgren

body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: One-paragraph overview of the goal and scope.
    validations:
      required: true

  - type: textarea
    id: links
    attributes:
      label: Related Issues (optional)
      description: Reference related items (even if sub-issues are used).
      value: |
        - [ ] #<id> 
