name: PR Title
on:
  pull_request:
    types: [opened, edited]

jobs:
  set-default-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const acceptable = /^\[(Feature|Fix|Refactor|Chore|Docs|Story)\]:\s/.test(pr.title);
            if (!acceptable) {
              const newTitle = "[Type]: ";
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                title: newTitle
              });
            }
