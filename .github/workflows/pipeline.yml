---
name: Ludus CI - Build & Unit Tests (Windows, self-hosted)
on:
  pull_request:
    branches: [ master ]
    types: [ opened, synchronize, reopened, ready_for_review ]
  push:
    branches: [ master ]
  workflow_dispatch: null
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    permissions:
        contents: read
        checks: write
        pull-requests: write
    concurrency:
        group: ci-${{ github.ref }}-${{ matrix.Configuration }}
        cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        Platform: [ x64 ]
        Configuration: [ Debug, Release ]
    name: Build & test - ${{ matrix.Platform }} / ${{ matrix.Configuration }}
    runs-on: [ self-hosted, windows, x64 ]
    env:
      Configuration: ${{ matrix.Configuration }}
      Platform: ${{ matrix.Platform }}
      VCPKG_DEFAULT_TRIPLET: x64-windows
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Bootstrap vcpkg
        shell: cmd
        run: |
          set "VCPKG_DIR=%GITHUB_WORKSPACE%\vcpkg"
          if not exist "%VCPKG_DIR%\vcpkg.exe" (
            git clone https://github.com/microsoft/vcpkg "%VCPKG_DIR%"
            call "%VCPKG_DIR%\bootstrap-vcpkg.bat" -disableMetrics
          )
          echo VCPKG_ROOT=%VCPKG_DIR%>> "%GITHUB_ENV%"
      - name: Setup vcpkg MSBuild integration
        shell: cmd
        run: |
          "%VCPKG_ROOT%\vcpkg.exe" integrate install
      - name: Install vcpkg dependencies (manifest)
        if: ${{ hashFiles('vcpkg.json') != '' }}
        shell: cmd
        run: |
          "%VCPKG_ROOT%\vcpkg.exe" install --triplet %VCPKG_DEFAULT_TRIPLET% --x-manifest-root="%GITHUB_WORKSPACE%" --x-install-root="%GITHUB_WORKSPACE%\.cache\vcpkg_installed"
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v1
      - name: Restore NuGet packages
        shell: cmd
        run: nuget restore Ludus.sln
      - name: Build tests
        shell: cmd
        run: msbuild .\Tests\Tests.vcxproj /m ^
          /p:Configuration=%Configuration% /p:Platform=%Platform%
      - name: Run GoogleTests
        shell: cmd
        run: |
          setlocal enabledelayedexpansion
          set "EXE="
          for /f "delims=" %%F in ('dir /s /b "Tests.exe"') do (
            set "EXE=%%F"
            set "EXEDIR=%%~dpF"
            goto runit
          )
          echo Tests.exe not found
          exit /b 1
          :runit
          set "RESULTS=!EXEDIR!TestResults"
          if not exist "!RESULTS!" mkdir "!RESULTS!"
          "!EXE!" --gtest_output=xml:"!RESULTS!\gtest.xml"
          exit /b !errorlevel!
      - name: Publish Ludus Unit Tests
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: "**/TestResults/*.xml"
          check_name: Ludus - Unit Tests (${{ matrix.Configuration }})
          include_passed: true
          detailed_summary: true
          token: ${{ github.token }}
      - name: Job summary
        if: always()
        shell: cmd
        run: |
          (
            echo # Ludus CI - Build ^& Unit Tests
            echo **Config:** %Configuration% ^| **Platform:** %Platform%
            echo.
            echo A "Ludus - Unit Tests" check is attached below with full details.
          )>> "%GITHUB_STEP_SUMMARY%"
