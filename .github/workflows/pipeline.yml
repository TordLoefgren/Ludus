name: Ludus CI (diagnostic)

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

env:
  Configuration: Debug
  Platform: x64

jobs:
  diag:
    runs-on: [self-hosted, windows, x64]
    steps:
      - uses: actions/checkout@v4

      - name: MSBuild/NuGet versions
        shell: cmd
        run: |
          where msbuild
          msbuild -version
          nuget help | find "NuGet Version"

      - name: Restore
        shell: cmd
        run: nuget restore Ludus.sln

      - name: Build solution (all projects enabled for this config)
        shell: cmd
        run: msbuild Ludus.sln /m /p:Configuration=%Configuration% /p:Platform=%Platform% /t:Build

      - name: Build tests explicitly (in case solution config doesn't include them)
        shell: cmd
        run: msbuild .\Ludus.Tests\Ludus.Tests.vcxproj /p:Configuration=%Configuration% /p:Platform=%Platform%

      - name: List test output
        shell: cmd
        run: dir /s /b Ludus.Tests\*.exe

      - name: Run GoogleTests (pinned path)
        shell: cmd
        working-directory: .\Ludus.Tests\x64\Debug
        run: Ludus.Tests.exe --gtest_output=xml:..\..\..\TestResults\gtest.xml

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: '**/TestResults/*.xml'
