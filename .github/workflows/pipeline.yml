---
name: Build & Test (Self-hosted Windows)
on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - "**"
  workflow_dispatch: null
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  Configuration: Debug
  Platform: x64
jobs:
  build-and-test:
    runs-on:
      - self-hosted
      - windows
      - x64
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v1
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.config') }}
          restore-keys: ${{ runner.os }}-nuget-
      - name: Restore
        shell: cmd
        run: nuget restore Ludus.sln
      - name: Build solution
        shell: cmd
        run: msbuild Ludus.sln /m /p:Configuration=%Configuration%
          /p:Platform=%Platform%
      - name: Ensure vcpkg deps (freetype)
        shell: pwsh
        run: >
          $root = 'C:\dev\tools\vcpkg'

          $triplet = 'x64-windows'

          if (-not (Test-Path "$root\installed\$triplet\debug\lib\freetype.lib")) {
            & "$root\vcpkg.exe" install freetype:$triplet
            if ($LASTEXITCODE) { throw "vcpkg install failed" }
          }
      - name: Run GoogleTests
        shell: cmd
        working-directory: .\x64\%Configuration%
        run: Ludus.Tests.exe --gtest_output=xml:..\TestResults\gtest.xml
      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action/composite@v2
        with:
          files: "**/TestResults/*.xml"
