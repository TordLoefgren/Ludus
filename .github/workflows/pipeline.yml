---
name: Build & Test (Self-hosted Windows)
on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - "**"
  workflow_dispatch: null
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  Configuration: Debug
  Platform: x64
jobs:
  build-and-test:
    runs-on:
      - self-hosted
      - windows
      - x64
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v1
      - name: Restore
        shell: cmd
        run: nuget restore Ludus.sln
      - name: Build tests (pulls Engine as dependency)
        shell: cmd
        run: msbuild .\Ludus.Tests\Ludus.Tests.vcxproj /m
          /p:Configuration=%Configuration% /p:Platform=%Platform%
      - name: Run GoogleTests (auto-discover exe)
        shell: powershell
        run: >
          $exe = Get-ChildItem -Recurse -Filter 'Ludus.Tests.exe' | Select-Object
          -First 1

          if (-not $exe) { throw "Ludus.Tests.exe not found" }

          $resultsDir = Join-Path $exe.Directory.FullName 'TestResults'

          New-Item -ItemType Directory -Force -Path $resultsDir | Out-Null

          & $exe.FullName --gtest_output=xml:"$resultsDir\gtest.xml"

          exit $LASTEXITCODE
      - name: list test output folder
        shell: cmd
        run: dir /s /b .\x64\%Configuration% || dir /s /b .
      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action/composite@v2
        with:
          files: "**/TestResults/*.xml"
