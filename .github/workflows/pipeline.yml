---
name: Build & Test (Self-hosted Windows)
on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - "**"
  workflow_dispatch: null
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  Configuration: Debug
  Platform: x64
jobs:
  build-and-test:
    runs-on:
      - self-hosted
      - windows
      - x64
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v1
      - name: Restore
        shell: cmd
        run: nuget restore Ludus.sln
      - name: Build tests (pulls Engine as dependency)
        shell: cmd
        run: msbuild .\Ludus.Tests\Ludus.Tests.vcxproj /m
          /p:Configuration=%Configuration% /p:Platform=%Platform%
      - name: Run GoogleTests (cmd, auto-discover exe)
        shell: cmd
        run: |
          setlocal enabledelayedexpansion
          set "EXE="
          for /f "delims=" %%F in ('dir /s /b "Ludus.Tests.exe"') do (
            set "EXE=%%F"
            set "EXEDIR=%%~dpF"
            goto runit
          )
          echo Ludus.Tests.exe not found
          exit /b 1
          :runit
          set "RESULTS=!EXEDIR!TestResults"
          if not exist "!RESULTS!" mkdir "!RESULTS!"
          "!EXE!" --gtest_output=xml:"!RESULTS!\gtest.xml"
          exit /b !errorlevel!
      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action/node@v2
        with:
          files: '**/TestResults/*.xml'
