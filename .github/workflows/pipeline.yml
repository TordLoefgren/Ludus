---
name: Build & Test (Self-hosted Windows)
on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - "**"
  workflow_dispatch: null
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  Configuration: Debug
  Platform: x64
jobs:
  build-and-test:
    runs-on:
      - self-hosted
      - windows
      - x64
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v1
      - name: Restore
        shell: cmd
        run: nuget restore Ludus.sln
      - name: Build tests (pulls Engine as dependency)
        shell: cmd
        run: msbuild .\Ludus.Tests\Ludus.Tests.vcxproj /m
          /p:Configuration=%Configuration% /p:Platform=%Platform%
      - name: Run GoogleTests
        shell: cmd
        run: >
          if not exist ".\x64\%Configuration%\TestResults" mkdir
          ".\x64\%Configuration%\TestResults"

          ".\x64\%Configuration%\Ludus.Tests.exe" --gtest_output=xml:".\x64\%Configuration%\TestResults\gtest.xml"
      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action/composite@v2
        with:
          files: "**/TestResults/*.xml"
